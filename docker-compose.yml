version: '3.8'

services:
  # --- Kafka Service ---
  kafka:
    image: confluentinc/cp-kafka:7.8.3
    container_name: kafka
    ports:
      - "29092:29092"

    environment:
      KAFKA_KRAFT_MODE: 'true'

      CLUSTER_ID: '1L6g7nGhU-eAKfL--X25wo'
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka_kraft:/var/lib/kafka/data
    networks:
      - metanet1

  # --- Apache Spark Service ---
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark-master
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - metanet1
    volumes:
      - spark-checkpoints:/opt/spark-checkpoints

  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile.spark-worker
    container_name: spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    depends_on:
      - spark-master
    networks:
      - metanet1
    volumes:
      - spark-checkpoints:/opt/spark-checkpoints

  spark-submit:
    build:
      context: .
      dockerfile: Dockerfile.spark-submit
    container_name: spark-submit
    depends_on:
      - spark-master
      - spark-worker
      - kafka
      - postgres-stream
    environment:
      - STREAM_POSTGRES_PASSWORD=${STREAM_POSTGRES_PASSWORD}
    networks:
      - metanet1
    volumes:
      - spark-checkpoints:/opt/spark-checkpoints
    restart: on-failure

  # --- Metabase BI Service ---
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: ${MB_POSTGRES_PASSWORD}
      MB_DB_HOST: postgres-meta
    networks:
      - metanet1
    depends_on:
      postgres-meta:
        condition: service_healthy

  # --- Metadata for Metabase BI ---
  postgres-meta:
    image: postgres:16
    container_name: postgres_metabase
    environment:
      POSTGRES_USER: metabase
      POSTGRES_DB: metabase
      POSTGRES_PASSWORD: ${MB_POSTGRES_PASSWORD}
    volumes:
      - ./pg_meta_data:/var/lib/postgresql/data
    networks:
      - metanet1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Streaming Aviation Data ---
  postgres-stream:
    image: postgres:16
    container_name: postgres_aviation
    environment:
      POSTGRES_USER: aviation_user
      POSTGRES_DB: aviation_db
      POSTGRES_PASSWORD: ${STREAM_POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - ./pg_stream_data:/var/lib/postgresql/data
    networks:
      - metanet1

networks:
  metanet1:
    driver: bridge

volumes:
  kafka_kraft:
  spark-checkpoints: